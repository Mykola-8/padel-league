<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Padel Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root { --accent:#00e5ff; --bg:rgba(4,8,15,0.92); --card:rgba(10,22,40,0.88); --border:rgba(0,229,255,0.22); --text:#fff; --gold:#ffd700; }
body{font-family:'Barlow Condensed',sans-serif;background:transparent;color:var(--text);width:1920px;height:1080px;overflow:hidden;padding:40px;}

.bracket-container { display: flex; gap: 20px; align-items: start; height: 100%; }
.column { display: flex; flex-direction: column; gap: 15px; width: 300px; }
.round-title { background: var(--card); border: 1px solid var(--border); padding: 5px; text-align: center; font-family: 'Bebas Neue'; color: var(--accent); }
.match { background: var(--bg); border: 1px solid var(--border); padding: 5px; margin-bottom: 10px; }
.team { display: flex; justify-content: space-between; padding: 3px; font-weight: 600; }
.winner { color: var(--accent); border-left: 2px solid var(--accent); }
.score { font-family: 'Bebas Neue'; }

/* Спеціальний контейнер для фіналу та третього місця */
.final-column { display: flex; flex-direction: column; gap: 20px; width: 300px; }
.third-place-box { border: 1px solid var(--gold); padding: 5px; background: var(--bg); }
.third-title { color: var(--gold); font-family: 'Bebas Neue'; text-align: center; margin-bottom: 5px; }
</style>
</head>
<body>

<div class="bracket-container" id="bracket"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const db = getDatabase(initializeApp({databaseURL: "https://overley-f58f8-default-rtdb.firebaseio.com"}));

onValue(ref(db, 'padel/state'), (snapshot) => {
  const state = snapshot.val();
  if (!state) return;
  const isLower = state.bracketView === 'lower';
  const fmt = isLower ? 16 : (parseInt(state.bracketFormat) || 8);
  const data = isLower ? (state.bracketDataLower || {}) : (state.bracketData || {});
  const rounds = Math.log2(fmt);
  const labels = ['1/8', '1/4', 'ПІВФІНАЛ'];

  let html = '';
  // Колонки раундів
  for (let r = 0; r < rounds; r++) {
    html += `<div class="column"><div class="round-title">${labels[r] || 'Раунд'}</div>`;
    for (let m = 0; m < fmt / Math.pow(2, r + 1); m++) {
      const match = data[`${r}-${m}`] || {t1:'—', t2:'—', s1:'-', s2:'-', winner:-1};
      html += `<div class="match">
        <div class="team ${match.winner===0?'winner':''}">${match.t1}<span class="score">${match.s1}</span></div>
        <div class="team ${match.winner===1?'winner':''}">${match.t2}<span class="score">${match.s2}</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  // Фінал та 3-тє місце
  const fm = data[`${rounds}-0`] || {t1:'—', t2:'—', s1:'-', s2:'-', winner:-1};
  const tp = state.thirdPlaceMatch || {};
  
  html += `<div class="final-column">
    <div class="column">
      <div class="round-title">ФІНАЛ</div>
      <div class="match">
        <div class="team ${fm.winner===0?'winner':''}">${fm.t1}<span class="score">${fm.s1}</span></div>
        <div class="team ${fm.winner===1?'winner':''}">${fm.t2}<span class="score">${fm.s2}</span></div>
      </div>
    </div>`;

  if (!isLower) {
    html += `<div class="third-place-box">
      <div class="third-title">Гра за третє місце</div>
      <div class="team ${tp.winner===0?'winner':''}">${tp.t1||'—'}<span class="score">${tp.s1||'-'}</span></div>
      <div class="team ${tp.winner===1?'winner':''}">${tp.t2||'—'}<span class="score">${tp.s2||'-'}</span></div>
    </div>`;
  }
  
  html += `</div>`;
  document.getElementById('bracket').innerHTML = html;
});
</script>
</body>
</html>
