<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Padel Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Montserrat:wght@500;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #00e5ff; --accent2: #ff6b35;
  --card-bg: rgba(5,12,28,0.88); --border: rgba(0,229,255,0.25);
  --text: #ffffff; --muted: #6a8fa8; --gold: #ffd700;
  --font-size: 15px; --scale: 1;
  --team-font: 'Barlow Condensed', sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Barlow Condensed',sans-serif; color:var(--text); }

/* ПЛАВНЕ ЗНИКНЕННЯ/ПОЯВА ОВЕРЛЕЮ */
#overlay-root { 
  position:fixed; inset:0; transform-origin:center center; 
  transform:scale(var(--scale)); pointer-events:none;
  transition: opacity 0.5s ease-in-out; 
  opacity: 1;
}

.view { display:none !important; width:100%; height:100%; align-items:center; justify-content:center; flex-direction:column; }
.view.active { display:flex !important; }
#v-groups.active { display:grid !important; align-content:center; justify-content:center; } 
#v-playoff.active { display:flex !important; flex-direction: column !important; align-items: center; justify-content: center; }

.team-name-text { 
  font-family: var(--team-font); font-weight: 600; letter-spacing: 0.5px; 
  text-transform: uppercase; word-break: break-word; white-space: normal; line-height: 1.15;
}

/* RANKINGS */
#v-rankings { padding:20px; }
#v-rankings .team-name-text { color: var(--rank-team, #ffffff); }
.rank-card { background:var(--rank-bg, var(--card-bg)); border:1px solid var(--border); border-radius:10px; overflow:hidden; min-width:520px; max-width: 95vw; box-shadow:0 8px 40px rgba(0,0,0,0.7); animation:slideIn .4s cubic-bezier(.22,.68,0,1.2); }
.rank-header { background:var(--rank-head, rgba(8,24,48,0.9)); padding:10px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--accent); }
.rank-header-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:3px; }
.rank-header-sub { font-size:11px; color:var(--muted); letter-spacing:1px; }
.rank-table { width:100%; border-collapse:collapse; font-size:var(--font-size); }
.rank-table th { background:var(--rank-head, rgba(0,0,0,0.5)); padding:7px 14px; font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.rank-table td { padding:9px 14px; border-bottom:1px solid rgba(255,255,255,0.05); }
.rank-table tr:last-child td { border-bottom:none; }
.seed-col { font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--accent); width:50px; }
.pts-col { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--accent2); text-align:right; }
.grp-badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:1px; background:rgba(0,229,255,0.12); color:var(--accent); border:1px solid rgba(0,229,255,0.3); }

/* GROUPS */
#v-groups { padding: 50px 60px; width:100%; height:100%; box-sizing: border-box; }
#v-groups .team-name-text { color: var(--group-team, #ffffff); }
.group-card { background:var(--group-bg, var(--card-bg)); border:1px solid var(--border); border-radius:8px; overflow:hidden; min-width:0; max-width: 100%; animation:slideIn .4s cubic-bezier(.22,.68,0,1.2); box-shadow:0 8px 40px rgba(0,0,0,0.7); font-size:var(--font-size); }
.group-card-head { background:var(--group-head, rgba(8,24,48,0.9)); padding:8px 14px; display:flex; align-items:center; gap:10px; border-bottom:2px solid var(--accent); }
.group-letter { font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1; color:var(--accent); }
.group-title { font-size:13px; font-weight:700; }
.group-sub { font-size:10px; color:var(--muted); }
.g-table { width:100%; border-collapse:collapse; }
.g-table th { background:var(--group-head, rgba(0,0,0,0.4)); padding:6px 10px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; text-align:center; }
.g-table td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.05); text-align:center; }
.g-table tr:last-child td { border-bottom:none; }
.advance-star { color:var(--gold); }
.pos-n { color:var(--muted); font-size:11px; margin-right:5px; }
.name-col { text-align:left; max-width:180px; }
.group-card.compact-teams .g-table td { padding:4px 8px; font-size:0.88em; }
.group-card.compact-teams .g-table th { padding:4px 8px; font-size:9px; }
.group-card.compact-teams .group-letter { font-size:26px; }
.group-card.compact-teams .group-card-head { padding:6px 12px; }
#v-groups.compact .group-card-head { padding:4px 10px; }
#v-groups.compact .group-letter { font-size:24px; }
#v-groups.compact .g-table td, #v-groups.compact .g-table th { padding:4px 8px; font-size:0.9em; }

/* SCHEDULE */
#v-schedule { padding:24px; }
#v-schedule td:not(.time-c) { color: var(--sched-team, #ffffff); }
.sched-wrap { background:var(--sched-bg, var(--card-bg)); border:1px solid var(--border); border-radius:10px; overflow:hidden; min-width:700px; max-width: 95vw; box-shadow:0 8px 40px rgba(0,0,0,0.7); animation:slideIn .4s cubic-bezier(.22,.68,0,1.2); font-size:var(--font-size); }
.s-table { width:100%; border-collapse:collapse; }
.s-table th { background:var(--sched-head, rgba(0,0,0,0.6)); padding:10px 14px; color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
.s-table td { padding:9px 14px; border-bottom:1px solid rgba(255,255,255,0.06); word-break: break-word; }
.s-table tr:last-child td { border-bottom:none; }
.time-c { color:var(--accent); font-family:'Bebas Neue',sans-serif; font-size:22px; width:90px; }
.break-r td { background:rgba(0,229,255,0.07); color:var(--accent) !important; font-style:italic; text-align:center; font-size:13px; }

/* PLAYOFF */
#v-playoff .team-name-text { color: var(--play-team, #ffffff); }
.playoff-title { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #ffffff; letter-spacing: 3px; margin-bottom: 25px; text-transform: uppercase; text-align: center; }
.bracket-outer { display: flex; gap: 35px; align-items: stretch; justify-content: center; width: 100%; height: calc(100% - 80px); padding: 0 20px; max-width: 100vw; }
.b-round { display: flex; flex-direction: column; justify-content: space-around; min-width: 230px; flex: 1; height: 100%; }
.b-match { background: var(--play-bg, #161a22); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 0px; overflow: hidden; margin: 6px 0; width: 100%; max-width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); animation: slideIn .4s cubic-bezier(.22,.68,0,1.2); }
.b-team { padding: 0 0 0 12px; height: 38px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.b-team:last-child { border-bottom: none; }
.b-team.winner { color: #fff; font-weight: 700; }
.b-team.loser { color: var(--muted); }
.b-score { display: flex; align-items: center; justify-content: center; min-width: 42px; height: 100%; background: #0091ea; color: #ffffff; font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: bold; }
.b-match.final-match { border: 2px solid #ffd700; box-shadow: 0 0 25px rgba(255, 215, 0, 0.3); }
.final-match-header { background: var(--play-head, rgba(0, 0, 0, 0.3)); color: #ffd700; font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-align: center; padding: 4px 0; border-bottom: 1px solid rgba(255, 215, 0, 0.2); text-transform: uppercase; }
.champ-card { background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 140, 0, 0.1)); border: 2px solid #ffd700; padding: 12px; text-align: center; margin-top: 10px; }
.champ-trophy { font-size: 28px; }
.champ-lbl { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px; color: #ffd700; margin: 2px 0; }
.champ-name { font-size: 15px; font-weight: 700; color: #fff; }

/* LOADING */
#loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(4,8,15,0.95); z-index:999; flex-direction:column; gap:14px; transition:opacity .5s; }
.loader { width:40px; height:40px; border:3px solid rgba(0,229,255,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
#loading-msg { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:3px; color:var(--accent); }

/* АНІМАЦІЇ */
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes slideIn { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
@keyframes singleGroupSwitch {
  0% { opacity: 0; transform: scale(0.9) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
</style>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
  <div id="loading-msg">ПІДКЛЮЧЕННЯ...</div>
</div>

<div id="overlay-root">
  <div class="view active" id="v-rankings">
    <div class="rank-card">
      <div class="rank-header">
        <div class="rank-header-title" id="rank-title">ГРАВЦІ 🇺🇦</div>
        <div class="rank-header-sub">Padel Tournament</div>
      </div>
      <table class="rank-table">
        <thead><tr><th>SEED</th><th>КОМАНДА / ГРАВЦІ</th><th>ГРУПА</th><th style="text-align:right">РЕЙТИНГ</th></tr></thead>
        <tbody id="rank-body"></tbody>
      </table>
    </div>
  </div>
  <div class="view" id="v-groups"></div>
  <div class="view" id="v-schedule">
    <div class="sched-wrap">
      <table class="s-table">
        <thead><tr id="sched-head"></tr></thead>
        <tbody id="sched-body"></tbody>
      </table>
    </div>
  </div>
  <div class="view" id="v-playoff">
    <div class="playoff-title" id="playoff-title">TOURNAMENT PLAYOFF</div>
    <div class="bracket-outer" id="bracket-outer"></div>
  </div>
</div>

<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVB0z7m3nOdrjId9FQPmxqxDb8Y1fH7lw",
  authDomain: "overley-f58f8.firebaseapp.com",
  databaseURL: "https://overley-f58f8-default-rtdb.firebaseio.com",
  projectId: "overley-f58f8",
  storageBucket: "overley-f58f8.firebasestorage.app",
  messagingSenderId: "414314418439",
  appId: "1:414314418439:web:9653a4c38c1206dfbb75a2",
  measurementId: "G-R06MDEYGQ1"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

function hideLoading() {
  const el = document.getElementById('loading');
  if(el) { el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 500); }
}

const timeout = setTimeout(() => { hideLoading(); applyState(defaultState()); }, 5000);

onValue(ref(db, 'padel/state'), (snap) => {
  clearTimeout(timeout);
  const state = snap.val();
  hideLoading();
  try { if (state) applyState(state); else applyState(defaultState()); } catch(e) { console.error(e); }
});

function defaultState() {
  return {
    isVisible: true,
    showSingleGroup: 'ALL',
    view: 'rankings', scale: 1, fontSize: 15, accent: '#00e5ff', bgOpacity: 0.88, teamFont: "'Barlow Condensed', sans-serif",
    colors: {
      rankings: { team: '#ffffff', bg: '#050c1c', head: '#081830' },
      groups:   { team: '#ffffff', bg: '#050c1c', head: '#081830' },
      schedule: { team: '#ffffff', bg: '#050c1c', head: '#000000' },
      playoff:  { team: '#ffffff', bg: '#161a22', head: '#000000' }
    },
    rankTitle: 'ГРАВЦІ (ЧОЛОВІКИ) 🇺🇦',
    rankings: [{seed:1, players:'Artem Yatsenko / Slava Sedoplatov', group:'A', pts:13420}],
    groupCount:4, teamCount:4, groups: autoGroups(4,4),
    schedHeaders: ['Час','Корт 1','Корт 2','Корт 3','Корт 4'],
    schedRows: [{time:'09:00', cells:['A1—A2','B1—B2','C1—C2','D1—D2'], isBreak:false}],
    bracketFormat: 4, bracketData: autoBracketData(4), champion: '— — —',
  };
}

function autoGroups(gc, tc) {
  const L = 'ABCDEFGH';
  return Array.from({length:gc}, (_,gi) => ({ letter: L[gi] || 'G', teams: Array.from({length:tc}, (_,ti) => ({ name:`${L[gi]||'G'}${ti+1} — Команда`, p:0, w:0, l:0, gd:'0:0', pts:0 })) }));
}

function autoBracketData(fmt) {
  const data={}, L='ABCDEFGH';
  for(let ri=0; ri<Math.log2(fmt); ri++){
    const count = fmt/Math.pow(2,ri+1);
    for(let mi=0; mi<count; mi++){ data[`${ri}-${mi}`] = { t1: ri===0 ? `${L[mi*2]||'T'}1` : `Переможець М${ri}.${mi*2+1}`, t2: ri===0 ? `${L[mi*2+1]||'T'}2` : `Переможець М${ri}.${mi*2+2}`, s1:'-', s2:'-', winner:-1 }; }
  }
  return data;
}

function hexToRgba(hex, opacity) {
  if(!hex) return 'transparent';
  if(hex.startsWith('rgba')) return hex;
  let r = parseInt(hex.substring(1,3), 16) || 0; let g = parseInt(hex.substring(3,5), 16) || 0; let b = parseInt(hex.substring(5,7), 16) || 0;
  return `rgba(${r},${g},${b},${opacity})`;
}

function applyState(s) {
  const rootEl = document.getElementById('overlay-root');
  if (s.isVisible === false) { rootEl.style.opacity = '0'; } 
  else { rootEl.style.opacity = '1'; }

  const root = document.documentElement.style;
  root.setProperty('--scale', s.scale || 1);
  root.setProperty('--font-size', (s.fontSize || 15)+'px');
  root.setProperty('--accent', s.accent || '#00e5ff');
  root.setProperty('--team-font', s.teamFont || "'Barlow Condensed', sans-serif");
  
  const op = s.bgOpacity || 0.88;
  const c = s.colors || defaultState().colors;

  root.setProperty('--rank-team', c.rankings.team); root.setProperty('--rank-bg', hexToRgba(c.rankings.bg, op)); root.setProperty('--rank-head', hexToRgba(c.rankings.head, Math.min(1, op + 0.1)));
  root.setProperty('--group-team', c.groups.team);  root.setProperty('--group-bg', hexToRgba(c.groups.bg, op));  root.setProperty('--group-head', hexToRgba(c.groups.head, Math.min(1, op + 0.1)));
  root.setProperty('--sched-team', c.schedule.team); root.setProperty('--sched-bg', hexToRgba(c.schedule.bg, op)); root.setProperty('--sched-head', hexToRgba(c.schedule.head, Math.min(1, op + 0.1)));
  root.setProperty('--play-team', c.playoff.team);  root.setProperty('--play-bg', hexToRgba(c.playoff.bg, op));  root.setProperty('--play-head', hexToRgba(c.playoff.head, Math.min(1, op + 0.1)));

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const safeView = s.view || 'rankings';
  const vEl = document.getElementById('v-' + safeView);
  if (vEl) vEl.classList.add('active');

  renderRankings(s); renderGroups(s); renderSchedule(s); renderPlayoff(s);
}

function renderRankings(s) {
  const titleEl = document.getElementById('rank-title'); if(titleEl) titleEl.textContent = s.rankTitle || 'ГРАВЦІ 🇺🇦';
  const tbody = document.getElementById('rank-body'); if(!tbody) return; tbody.innerHTML = '';
  (s.rankings || []).forEach(r => {
    const tr = document.createElement('tr'); tr.innerHTML = `<td class="seed-col">${r.seed || ''}</td><td class="team-name-text">${r.players || ''}</td><td><span class="grp-badge">${r.group || ''}</span></td><td class="pts-col">${r.pts || 0}</td>`; tbody.appendChild(tr);
  });
}

function renderGroups(s) {
  const view = document.getElementById('v-groups'); if(!view) return; view.innerHTML = '';
  const gc = s.groupCount || 4; const tc = s.teamCount || 4; 
  const showSingle = s.showSingleGroup || 'ALL';
  
  let cols = 2;
  if (showSingle !== 'ALL') {
    cols = 1; // Якщо показуємо одну групу - лише одна колонка
  } else {
    if(gc === 3) cols = 3; else if(gc === 4) cols = 2; else if(gc === 6) cols = 2; else if(gc >= 8) cols = 4;
  }
  
  view.style.gridTemplateColumns = `repeat(${cols}, 1fr)`; 
  view.style.gap = gc >= 6 ? '25px' : '45px';
  if (gc >= 6 && showSingle === 'ALL') view.classList.add('compact'); else view.classList.remove('compact');

  const safeGroups = s.groups || autoGroups(gc, tc);
  let groupsToRender = [];

  // Фільтруємо групи, якщо вибрано показ однієї
  if (showSingle !== 'ALL') {
    const idx = parseInt(showSingle);
    if (safeGroups[idx]) groupsToRender.push({ data: safeGroups[idx], originalIndex: idx });
  } else {
    safeGroups.forEach((g, i) => groupsToRender.push({ data: g, originalIndex: i }));
  }

  groupsToRender.forEach((item) => {
    const grp = item.data;
    const gi = item.originalIndex;
    if(!grp) return;
    
    const letter = 'ABCDEFGH'[gi] || String.fromCharCode(65+gi);
    const card = document.createElement('div'); 
    card.className = 'group-card' + (tc >= 5 ? ' compact-teams' : '');
    
    // Спеціальні стилі та анімація для режиму "Одиночна група"
    if (showSingle !== 'ALL') {
      card.style.maxWidth = '680px';
      card.style.margin = '0 auto';
      card.style.animation = 'singleGroupSwitch 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both';
    }

    let rows = '';
    (grp.teams || []).forEach((team, ti) => {
      if(!team) return;
      rows += `<tr><td class="team-name-text name-col"><span class="pos-n">${ti+1}</span>${team.name || ''}</td><td>${team.p||0}</td><td>${team.w||0}</td><td>${team.l||0}</td><td>${team.gd||'0:0'}</td><td>${team.pts||0}</td><td>${ti<2?'<span class="advance-star">★</span>':''}</td></tr>`;
    });
    card.innerHTML = `<div class="group-card-head"><div class="group-letter">${letter}</div><div><div class="group-title">Група ${letter}</div><div class="group-sub">★ Top 2 → Плей-оф</div></div></div><table class="g-table"><thead><tr><th>Команда</th><th>І</th><th>В</th><th>П</th><th>МГ</th><th>Очки</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    view.appendChild(card);
  });
}

function renderSchedule(s) {
  const thead = document.getElementById('sched-head'); if(!thead) return; thead.innerHTML = '';
  const headers = s.schedHeaders || ['Час','Корт 1','Корт 2','Корт 3','Корт 4'];
  headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; thead.appendChild(th); });
  const tbody = document.getElementById('sched-body'); if(!tbody) return; tbody.innerHTML = '';
  const cols = headers.length;
  (s.schedRows || []).forEach(row => {
    if(!row) return; const tr = document.createElement('tr'); const cells = row.cells || []; 
    if (row.isBreak) {
      tr.className = 'break-r'; tr.innerHTML = `<td class="time-c">${row.time || '--:--'}</td><td colspan="${cols-1}">${cells[0] || ''}</td>`;
    } else {
      let tds = ''; for(let i = 0; i < cols - 1; i++) tds += `<td>${cells[i] || ''}</td>`;
      tr.innerHTML = `<td class="time-c">${row.time || '--:--'}</td>` + tds;
    }
    tbody.appendChild(tr);
  });
}

function renderPlayoff(s) {
  const outer = document.getElementById('bracket-outer'); if(!outer) return; outer.innerHTML = '';
  const fmt = s.bracketFormat || 4;
  const titleEl = document.getElementById('playoff-title'); if (titleEl) titleEl.textContent = `TOURNAMENT PLAYOFF 1/${fmt}`;
  const data = s.bracketData || autoBracketData(fmt);
  const labels = fmt===8 ? ['1/8','1/4','1/2','FINAL'] : fmt===4 ? ['1/4','1/2','FINAL'] : ['1/2','FINAL'];
               
  labels.forEach((label, ri) => {
    const rd = document.createElement('div'); rd.className = 'b-round';
    const count = fmt / Math.pow(2, ri+1); const isFinalRound = (ri === labels.length - 1);
    
    for (let mi = 0; mi < count; mi++) {
      const m = data[`${ri}-${mi}`] || {t1:'—',t2:'—',s1:'-',s2:'-',winner:-1};
      const mc = document.createElement('div'); 
      if (isFinalRound) {
        mc.className = 'b-match final-match';
        mc.innerHTML = `<div class="final-match-header">FINAL MATCH</div><div class="b-team ${m.winner===0?'winner':m.winner===1?'loser':''}"><span class="team-name-text">${m.t1 || ''}</span><span class="b-score">${m.s1 || '0'}</span></div><div class="b-team ${m.winner===1?'winner':m.winner===0?'loser':''}"><span class="team-name-text">${m.t2 || ''}</span><span class="b-score">${m.s2 || '0'}</span></div>`;
      } else {
        mc.className = 'b-match';
        mc.innerHTML = `<div class="b-team ${m.winner===0?'winner':m.winner===1?'loser':''}"><span class="team-name-text">${m.t1 || ''}</span><span class="b-score">${m.s1 || '0'}</span></div><div class="b-team ${m.winner===1?'winner':m.winner===0?'loser':''}"><span class="team-name-text">${m.t2 || ''}</span><span class="b-score">${m.s2 || '0'}</span></div>`;
      }
      rd.appendChild(mc);
    }
    if (isFinalRound && s.champion && s.champion !== '— — —') {
      const cc = document.createElement('div'); cc.className = 'champ-card';
      cc.innerHTML = `<div class="champ-trophy">🏆</div><div class="champ-lbl">ЧЕМПІОН</div><div class="champ-name team-name-text">${s.champion}</div>`;
      rd.appendChild(cc);
    }
    outer.appendChild(rd);
  });
}
</script>
</body>
</html>
