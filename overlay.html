<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Padel Overlay</title>
<!-- Підключення шрифтів -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --accent:#00e5ff; --bg:rgba(4,8,15,0.92); --text:#fff; }
  body { font-family: 'Barlow Condensed', sans-serif; background: transparent; color: var(--text); overflow: hidden; width: 1920px; height: 1080px; }
  
  /* Контейнер оверлею */
  .overlay-content { width: 1920px; height: 1080px; padding: 50px; }
  
  /* Стилі таблиць */
  .table-main { width: 100%; background: var(--bg); border: 1px solid var(--accent); padding: 20px; border-radius: 10px; }
  .title { font-family: 'Bebas Neue'; font-size: 48px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; font-size: 24px; }
</style>
</head>
<body>

<div class="overlay-content" id="overlay-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const db = getDatabase(initializeApp({databaseURL: "https://overley-f58f8-default-rtdb.firebaseio.com"}));

onValue(ref(db, 'padel/state'), (snapshot) => {
  const state = snapshot.val();
  if (!state) return;
  
  const root = document.getElementById('overlay-root');
  
  // Перемикач режимів (view)
  if (state.view === 'rankings') {
    renderRankings(state, root);
  } else if (state.view === 'groups') {
    renderGroups(state, root);
  } else if (state.view === 'playoff') {
    // Тут залишиться ваш код сітки, який ми робили раніше
    renderPlayoff(state, root);
  }
});

function renderRankings(state, root) {
  let html = `<div class="title">Рейтинг команд</div><div class="table-main">`;
  (state.rankings || []).forEach((r, i) => {
    html += `<div class="row"><div>${i+1}. ${r.players}</div><div>${r.pts} очок</div></div>`;
  });
  html += `</div>`;
  root.innerHTML = html;
}

function renderGroups(state, root) {
  let html = `<div class="title">Груповий етап</div><div class="table-main">`;
  (state.groups || []).forEach(g => {
    html += `<div>Група ${g.letter}</div>`;
    (g.teams || []).forEach(t => {
      html += `<div class="row"><div>${t.name}</div><div>${t.pts} очок</div></div>`;
    });
  });
  html += `</div>`;
  root.innerHTML = html;
}

function renderPlayoff(state, root) {
  // Тут вставте той код сітки, який ми щойно налаштували (bracket-tree)
  root.innerHTML = "ТУТ МАЄ БУТИ ВАША СІТКА";
}
</script>
</body>
</html>
